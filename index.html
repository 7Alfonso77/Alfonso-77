<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuenta Sushis</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="app" id="tapArea" aria-live="polite">
      <header class="app__header">
        <p class="chip">🍣 Sushi counter</p>
        <h1>Cuenta tus sushis</h1>
        <p class="subtitle">Haz tap en la pantalla y registra cada bocado.</p>
      </header>

      <section class="counter" aria-label="Contador de sushis">
        <div class="counter__plate">
          <span class="counter__number" id="count">0</span>
          <span class="counter__label">sushis</span>
        </div>
        <p class="counter__hint">Toca cualquier parte de la pantalla 🍣</p>
      </section>

      <section class="actions" aria-label="Acciones">
        <button class="primary" id="tapButton" type="button">Sumar sushi</button>
        <button class="ghost" id="resetButton" type="button">Reiniciar</button>
      </section>

      <footer class="footer">Disfruta tu comida con estilo ✨</footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
